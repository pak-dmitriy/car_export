spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5434/carexportdb}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:root}
  jpa:
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB

server:
  port: ${PORT:8081}

jwt:
  secret: ${JWT_SECRET:dev-secret-key-change-me-dev-secret-key-change-me}
  expiration-ms: 86400000

cors:
  allowed-origins: ${CORS_ORIGINS:http://localhost:5173,http://localhost:3000}

storage:
  upload-dir: ${UPLOAD_DIR:uploads}

app:
  admin:
    email: ${ADMIN_EMAIL:}
    password: ${ADMIN_PASSWORD:}
  demo-buyer:
    email: ${DEMO_BUYER_EMAIL:}
    password: ${DEMO_BUYER_PASSWORD:}