spring:
  datasource:
    url: jdbc:postgresql://localhost:5434/carexportdb
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:root}
  jpa:
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB

server:
  port: 8081

jwt:
  secret: ${JWT_SECRET:dev-secret-key-change-me-dev-secret-key-change-me}
  expiration-ms: 86400000

cors:
  allowed-origins:
    http://localhost:5173,
    http://localhost:3000

storage:
  upload-dir: uploads